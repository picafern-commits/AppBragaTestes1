<script id="APP_BRAGA_THEME_LOADER">
(function(){

  try{

    const savedTheme =
      localStorage.getItem("app-theme") || "dark";

    if(savedTheme === "dark"){
      document.documentElement.classList.add("dark");
      document.body.classList.add("dark");
    }

  }catch(e){
    console.log(e);
  }

})();
</script>

<main class="main">

  <div class="page-hero">
    <div class="page-hero-title">Manutenção Impressoras</div>
	<span class="status-pill">Sistema Online</span>
  </div>

  <div class="stats-grid">
    <div class="stat-card"><span>Total</span><strong id="countManutTotal">0</strong></div>
    <div class="stat-card"><span>Pendentes</span><strong id="countManutPendentes">0</strong></div>
    <div class="stat-card"><span>Em reparação</span><strong id="countManutReparacao">0</strong></div>
  </div>
  
  <div class="panel form-grid">
    <label><span>Técnico</span><input id="manutencaoTecnico" type="text"></label>
    <label><span>Estado</span><select id="manutencaoEstado"><option>Pendente</option><option>Em reparação</option><option>Resolvido</option></select></label>
    <label><span>Armazém</span><select id="manutencaoArmazem"><option value="">Selecionar armazém</option><option value="Braga">Braga</option><option value="Vila Real">Vila Real</option></select></label>
    <label><span>Localização</span><select id="manutencaoLocalizacao"></select></label>
    <label><span>Modelo</span><select id="manutencaoModelo"><option value="">Selecionar modelo</option><option value="P3155DN">P3155DN</option><option value="TASKalfa_255ci">TASKalfa_255ci</option><option value="PA5500x">PA5500x</option></select></label>
    <label><span>Nº Série</span><select id="manutencaoSerie"></select></label>
    <label><span>IP</span><select id="manutencaoIP"></select></label>
    <label><span>Data Pedido</span><input id="manutencaoPedido" type="date"></label>
    <label><span>Data Resolução</span><input id="manutencaoResolucao" type="date"></label>
    <label class="full"><span>Motivo</span><textarea id="manutencaoMotivo" rows="3"></textarea></label>
    <button class="primary-btn" onclick="guardarManutencao()">Guardar manutenção</button>
  </div>
  <div class="panel">
    <div class="toolbar printers-toolbar">
      <input id="searchManutencoes" type="text" placeholder="Pesquisar..." oninput="filtrarManutencoes()">
      <select id="filterEstadoManutencao" onchange="filtrarManutencoes()"><option value="">Todos os estados</option><option value="Pendente">Pendente</option><option value="Em reparação">Em reparação</option><option value="Resolvido">Resolvido</option></select>
      <select id="filterArmazemManutencao" onchange="filtrarManutencoes()"><option value="">Todos os armazéns</option><option value="Braga">Braga</option><option value="Vila Real">Vila Real</option></select>
    </div>
    <div id="listaManutencoes" class="cards-list"></div>
  </div>

</main>
